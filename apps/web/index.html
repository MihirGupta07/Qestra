<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qestra Orchestrator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">Q</span>
        <div>
          <strong>Qestra OS</strong>
          <small>Agent orchestration</small>
        </div>
      </div>

      <nav class="nav">
        <button class="active">Dashboard</button>
        <button>Agents</button>
        <button>Tickets</button>
        <button>Approvals</button>
        <button>Audit Log</button>
      </nav>
    </aside>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Acme Robotics</p>
          <h1>Orchestration Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <button id="heartbeatBtn" class="secondary">Run Heartbeat</button>
          <button id="newTaskBtn">Create Task</button>
        </div>
      </header>

      <section class="metrics" aria-label="Platform metrics">
        <article>
          <span>Active agents</span>
          <strong id="activeAgents">0</strong>
        </article>
        <article>
          <span>Open tasks</span>
          <strong id="openTasks">0</strong>
        </article>
        <article>
          <span>Pending approvals</span>
          <strong id="pendingApprovals">0</strong>
        </article>
        <article>
          <span>Budget used</span>
          <strong id="budgetUsed">$0.00</strong>
        </article>
      </section>

      <section class="workspace">
        <div class="panel main-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Execution graph</p>
              <h2>Live Agent Work</h2>
            </div>
            <span id="systemState" class="status-pill">Idle</span>
          </div>
          <div id="executionStream" class="execution-stream"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Roster</p>
              <h2>Agents</h2>
            </div>
          </div>
          <div id="agentList" class="agent-list"></div>
        </div>
      </section>

      <section class="workspace lower">
        <div class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Queue</p>
              <h2>Tasks</h2>
            </div>
          </div>
          <div id="taskList" class="task-list"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Governance</p>
              <h2>Approvals</h2>
            </div>
          </div>
          <div id="approvalList" class="approval-list"></div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
